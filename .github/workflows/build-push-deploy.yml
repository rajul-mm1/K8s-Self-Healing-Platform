# Builds all 3 images, pushes to ECR, and deploys via Helm.
# Runs only on main so every merge is a controlled, reviewed deploy.
name: Build, Push, Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

env:
  AWS_REGION: us-west-2
  EKS_CLUSTER_NAME: self-healing-k8s-eks

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Debug OIDC token
        run: |
          curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -R 'split(".") | .[1] | @base64d | fromjson'

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/todo-backend:${{ steps.tag.outputs.tag }},${{ steps.ecr-login.outputs.registry }}/todo-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/todo-frontend:${{ steps.tag.outputs.tag }},${{ steps.ecr-login.outputs.registry }}/todo-frontend:latest

      - name: Build & push remediation engine
        uses: docker/build-push-action@v6
        with:
          context: remediation
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/remediation-engine:${{ steps.tag.outputs.tag }},${{ steps.ecr-login.outputs.registry }}/remediation-engine:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Helm upgrade
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          helm upgrade --install todo-app ./helm/todo-app \
            --set image.registry="$ECR_REGISTRY" \
            --set image.tag="${{ needs.build-and-push.outputs.image_tag }}" \
            --wait --timeout 5m
