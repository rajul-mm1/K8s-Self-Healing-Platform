# Build + test on every push/PR. Does NOT push images or touch AWS --
# that only happens in build-push-deploy.yml on merges to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: app/backend/package.json }
      - run: npm install
      - run: npm test --if-present

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: app/frontend/package.json }
      - run: npm install
      - run: npm run build

  remediation-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remediation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -c "import app"   # smoke import; expand with pytest as the project grows
